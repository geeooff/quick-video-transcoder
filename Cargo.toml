[package]
name = "quick-video-transcoder"
version = "1.0.0"
authors = ["Geoffrey Vancoetsem"]
edition = "2024"
# egui 0.37 needs Rust 1.95.
rust-version = "1.95"
description = "Queue game captures, trim them on a timeline and re-encode each one to fit a size-limited destination such as Messenger, with HDR to SDR tone mapping."
license = "MIT"
repository = "https://github.com/Geeooff/quick-video-transcoder"
readme = "README.md"
keywords = ["ffmpeg", "video", "transcoding", "hdr", "egui"]
categories = ["multimedia::video"]
# An application, not a library: never meant for crates.io.
publish = false

[[bin]]
name = "quick-video-transcoder"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
eframe = { version = "0.37.0", features = ["persistence"] }
# Only to turn on egui's monochrome symbol fonts (egui 0.37 no longer embeds them by default): the
# buttons' symbols stay monochrome instead of falling back to the system's colour emoji. Same version as
# eframe; Dependabot bumps both together.
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
env_logger = "0.11.11"
# Localization: Project Fluent through i18n-embed (the .ftl files are embedded in the executable, and
# `fl!` checks every message id against the English file at compile time), numbers formatted by ICU4X
# with CLDR data compiled in, so a French "25,0 Mo" is the same on every OS. See src/i18n.rs.
fixed_decimal = { version = "0.7.3", features = ["ryu"] }
fluent-bundle = "0.16.0"
i18n-embed = { version = "0.16.0", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10.1"
icu_decimal = "2.4.0"
icu_locale_core = { version = "2.4.0", features = ["alloc"] }
# `sync`: the formatter must be Send + Sync to live in a Fluent function.
icu_provider = { version = "2.4.0", features = ["sync"] }
rust-embed = "8.14.0"
unic-langid = "0.9.6"
log = "0.4.34"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
# Pseudo-localization (debug builds, QVT_PSEUDO=1): every text elongated and bracketed, to spot a text left
# in code and a layout that cannot take a longer language.
fluent-pseudo = "0.3.3"

[target.'cfg(windows)'.dependencies]
# Copies the encoded files to the clipboard as a file list (CF_HDROP), so they paste straight into a chat.
clipboard-win = "5.4.1"

[dev-dependencies]
fluent-syntax = "0.12.0"
tempfile = "3.27.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
# Panics keep unwinding: a worker thread that fails must not take the window down.

# For checks, not for users: local builds and pull request CI. Fat LTO runs on one thread (1 min 43 s on
# a 16-core CPU after each commit); thin LTO spreads over the cores (22 s), for an executable about 12 %
# larger. Published releases always use `release` (scripts/build.ps1 release without -Fast).
[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
